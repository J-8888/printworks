<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Printworks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0e1014;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: rgba(34,197,94,0.12);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #e8e8e8;
      line-height: 1;
    }

    .logo p {
      font-size: 10px;
      color: #4a4f5a;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: #141720;
      border: 1px solid #1e2228;
      border-radius: 24px;
      padding: 28px 24px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #e8e8e8;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 13px;
      color: #4a4f5a;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #8a8f9a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      background: #0e1014;
      border: 1.5px solid #1e2228;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      color: #e8e8e8;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    .field input::placeholder { color: #2e333d; }
    .field input:focus { border-color: #22c55e; }
    .field input.error { border-color: #ef4444; }

    .error-msg {
      font-size: 13px;
      color: #f87171;
      margin-bottom: 16px;
      text-align: center;
      min-height: 20px;
    }

    .btn {
      width: 100%;
      background: #22c55e;
      color: #000;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px;
    }

    .btn:active { transform: scale(0.98); }
    .btn:hover { background: #16a34a; }
    .btn:disabled { background: #1e2228; color: #4a4f5a; cursor: not-allowed; transform: none; }

    .spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <path d="M10 2L18 6.5V13.5L10 18L2 13.5V6.5L10 2Z" stroke="#22c55e" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M10 2V18M2 6.5L18 6.5" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.5"/>
      </svg>
    </div>
    <div>
      <h1>PRINTWORKS</h1>
      <p>3D Print Lab</p>
    </div>
  </div>

  <div class="card">
    <p class="card-title">Welcome back</p>
    <p class="card-sub">Sign in to access your dashboard</p>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />
    </div>

    <p class="error-msg" id="error-msg"></p>

    <button class="btn" id="login-btn" onclick="doLogin()">Sign In</button>
  </div>

  <script>
    // If already logged in, redirect
    if (localStorage.getItem('pw_token')) {
      window.location.href = '/';
    }

    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('error-msg');

      errEl.textContent = '';
      if (!username || !password) {
        errEl.textContent = 'Please enter your username and password';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('pw_token', data.token);
          window.location.href = '/';
        } else {
          errEl.textContent = 'Invalid username or password';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch {
        errEl.textContent = 'Something went wrong, please try again';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
